name: CI (CPU)

permissions:
  contents: write

on:
  pull_request:
  push:
    branches: [ main, feat/* ]
  schedule:
    - cron: '0 0 * * 1'  # weekly on Monday at 00:00 UTC

jobs:
  cpu-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup environment and install deps
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -V
          pip install -U pip
          pip install -r requirements.txt
          pip install pre-commit pytest pytest-cov pyyaml mypy ruff

      - name: Pre-commit (lint/format)
        run: |
          . .venv/bin/activate
          pre-commit run --all-files || true

      - name: Auto-commit pre-commit changes (if any)
        # Avoid pushing from forks; safe in this repo
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          . .venv/bin/activate
          if git status --porcelain | grep .; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(pre-commit): auto-fix formatting"
            git push
            # stop this run so a clean run re-triggers with the new commit
            exit 1
          fi

      - name: Validate config (YAML syntax)
        run: |
          . .venv/bin/activate
          if [ -f tools/validate_config.py ]; then python tools/validate_config.py || true; fi

      - name: Validate STATE next_steps (CI)
        run: |
          . .venv/bin/activate
          python tools/ensure_next_steps.py --ci

      - name: Enforce tests accompany code changes
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          . .venv/bin/activate
          python tools/check_tests_required.py

      - name: Ensure PR body cites the spec
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          . .venv/bin/activate
          python tools/critic_pr_body_refs.py

      - name: Spec bump guard
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_TITLE: "${{ github.event.pull_request.title }}"
          GITHUB_BASE_REF: "${{ github.base_ref }}"
        run: |
          . .venv/bin/activate
          python tools/check_spec_bump.py "${{ github.event.pull_request.title || '' }}"

      - name: Deterministic smoke run
        run: |
          . .venv/bin/activate
          if [ -f configs/sim_config.smoke.yaml ]; then \
            python main.py --features configs/features.yaml --sim configs/sim_config.smoke.yaml; \
          else \
            echo "No smoke config; skipping"; \
          fi

      - name: Run full test suite with coverage
        run: |
          . .venv/bin/activate
          pytest -q --maxfail=1 --disable-warnings --cov=models --cov=src

      - name: Check state conflict
        run: |
          . .venv/bin/activate
          python tools/check_state_conflict.py
