name: CI (CPU)

permissions:
  contents: write

on:
  pull_request:
  push:
    branches: [ feat/test-hardening ]
  schedule:
    - cron: '0 0 * * 1'  # weekly on Monday at 00:00 UTC

jobs:
  cpu-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Setup environment and install deps
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r requirements.txt
          pip install pre-commit pytest pytest-cov pyyaml
          bash scripts/codex.setup.sh
          python tools/validate_config.py

      - name: Pre-commit (lint/format)
        run: |
          . .venv/bin/activate
          pre-commit run --all-files || true

      - name: Auto-commit pre-commit changes (if any)
        run: |
          . .venv/bin/activate
          git status --porcelain
          if git status --porcelain | grep .; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(pre-commit): auto-fix formatting"
            git push
            # cause this run to stop so a clean run re-triggers
            exit 1
          fi
      - name: Deterministic smoke run (first)
        run: |
          . .venv/bin/activate
          python main.py --features configs/features.yaml --sim configs/sim_config.smoke.yaml
      - name: Deterministic smoke run (second)
        run: |
          . .venv/bin/activate
          python main.py --features configs/features.yaml --sim configs/sim_config.smoke.yaml
      - name: Non-deterministic run
        run: |
          . .venv/bin/activate
          # override deterministic to false by editing config; here we just run default sim config
          python main.py --features configs/features.yaml --sim configs/sim_config.yaml
      - name: Run tests with coverage
        run: |
          . .venv/bin/activate
          pytest -q --maxfail=1 --disable-warnings --cov=models --cov=src
      - name: Check spec bump
        run: |
          . .venv/bin/activate
          python tools/check_spec_bump.py
      - name: Check state conflict
        run: |
          . .venv/bin/activate
          python tools/check_state_conflict.py
