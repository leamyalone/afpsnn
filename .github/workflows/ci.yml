name: CI (CPU)

on:
  pull_request:
  push:
    branches: [ main, feat/* ]
  schedule:
    - cron: '0 0 * * 1'  # weekly on Monday at 00:00 UTC

jobs:
  cpu-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -U pip
          pip install -r requirements.txt pytest pytest-cov pyyaml pre-commit mypy ruff
      - name: Pre-commit (lint/format)
        run: |
          . .venv/bin/activate
          pre-commit run --all-files
      - name: Validate config (YAML syntax)
        run: |
          . .venv/bin/activate
          python tools/validate_config.py || true
      - name: Validate STATE next_steps (CI)
        run: |
          . .venv/bin/activate
          python tools/ensure_next_steps.py --ci
      - name: Enforce tests accompany code changes
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          . .venv/bin/activate
          python tools/check_tests_required.py
      - name: Ensure PR body cites the spec
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          . .venv/bin/activate
          python tools/critic_pr_body_refs.py
      - name: Spec bump guard
        env:
          PR_TITLE: "${{ github.event.pull_request.title }}"
          GITHUB_BASE_REF: "${{ github.base_ref }}"
        run: |
          . .venv/bin/activate
          python tools/check_spec_bump.py "${{ github.event.pull_request.title || '' }}"
      - name: Deterministic smoke run
        run: |
          . .venv/bin/activate
          python main.py --features configs/features.yaml --sim configs/sim_config.smoke.yaml
      - name: Run full test suite with coverage
        run: |
          . .venv/bin/activate
          pytest -q --maxfail=1 --disable-warnings --cov=models --cov=src
      - name: Check state conflict
        run: |
          . .venv/bin/activate
          python tools/check_state_conflict.py
